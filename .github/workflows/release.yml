name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Update composer.json version
        if: steps.tag_version.outputs.new_tag
        run: |
          php -r '
            $file = "composer.json";
            $json = json_decode(file_get_contents($file), true);
            $json["version"] = ltrim("${{ steps.tag_version.outputs.new_version }}", "v");
            file_put_contents($file, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Commit composer.json version bump
        if: steps.tag_version.outputs.new_tag
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
          file_pattern: composer.json

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
